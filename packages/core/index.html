<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aero Debug Page</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        position: relative;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 4/3;
        background: #000;
        margin-top: 20px;
      }
      video {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover;
        opacity: 0; /* Hide raw video, draw mirrored on canvas */
      }
      canvas {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover;
      }
      .debug-panel {
        margin-top: 20px;
        padding: 15px;
        background: #222;
        border-radius: 8px;
        width: 90%;
        max-width: 640px;
        box-sizing: border-box;
      }
      .event-log {
        height: 120px;
        overflow-y: auto;
        font-family: monospace;
        background: #000;
        padding: 10px;
        border-radius: 4px;
        margin-top: 10px;
      }
      .log-entry { margin: 2px 0; color: #4ade80; }
    </style>
  </head>
  <body>
    <aero-pill id="aero-pill"></aero-pill>
    <h1>Aero Core Vision (Debug)</h1>
    <div class="container">
      <video id="webcam" playsinline></video>
      <canvas id="output"></canvas>
    </div>
    <div class="debug-panel">
      <div><strong>Current Gesture:</strong> <span id="current-gesture">None</span></div>
      <div class="event-log" id="log"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
